# XcodeGen spec for the bx iOS dev build (phase 2: no UI, driven by scripts/ios-dev.sh).
# The generated .xcodeproj, the libbox framework and the Dev config are not committed.
name: BxiOS
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  BxApp:
    build:
      targets:
        BxApp: all
    test:
      targets:
        - BxAppUITests
targets:
  BxApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Dev
        type: folder
        buildPhase: resources
      - path: ../../internal/embedded/assets/china_domain.txt
        buildPhase: resources
      - path: ../../internal/embedded/assets/china_cidr4.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getbx.bx.ios
        PRODUCT_NAME: bx
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        # App/Assets.xcassets: icon (light / dark / tinted) and the accent blue, both from the
        # design pack via apps/ios/icon/gen-ios-icons.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: bx
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        # 跟随系统语言:简体中文的 iPhone 上整个 App 是中文(App/zh-Hans.lproj)。
        CFBundleLocalizations: [en, zh-Hans]
        UILaunchScreen: {}
        NSCameraUsageDescription: bx uses the camera only to scan the code that adds your server.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # bx:// links open the app (the Mac's "Add to iPhone" QR, scanned with the Camera). The app
        # always asks before using one — see TunnelController.receive.
        CFBundleURLTypes:
          - CFBundleURLName: com.getbx.bx.ios
            CFBundleURLSchemes: [bx]
        # Rule sync reads http://sync.bx.internal/…: a reserved name the phone's own config routes
        # into the tunnel (onto the VPS's loopback store). Plain HTTP is fine there — it only ever
        # travels inside the tunnel, and the payload is sealed by policysync anyway.
        NSAppTransportSecurity:
          NSExceptionDomains:
            sync.bx.internal:
              NSExceptionAllowsInsecureHTTPLoads: true
    dependencies:
      - target: BxTunnel
        embed: true
      - framework: Frameworks/Bxkit.xcframework
        embed: false
  BxTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
      - path: Shared
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: bx tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getbx.bx.ios.tunnel
        CODE_SIGN_ENTITLEMENTS: Tunnel/Tunnel.entitlements
    dependencies:
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: UIKit.framework # libbox references UIApplication background-task symbols
  BxAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getbx.bx.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BxApp
