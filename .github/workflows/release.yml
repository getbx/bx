name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Test
        run: go test ./...

      - name: Build artifacts
        run: |
          set -euo pipefail
          # **这里是 dist,不是 dist.noindex。** 那个后缀是为了本机 Spotlight
          # 不索引构建产物(搜 "bx" 会出来五个 Bx.app),而 CI 上没有 Spotlight。
          # 2026-08-17 一次全局替换把它也改了,而 build 里的 `cd dist && zip`
          # 没跟着改 —— 于是 v0.3.0 的第一次发布在 `zip: Nothing to do` 上失败。
          # **release.yml 只在打 tag 时跑,平时的 CI 覆盖不到它。**
          mkdir -p dist
          version="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          commit="${GITHUB_SHA::12}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/getbx/bx/internal/version.Version=$version -X github.com/getbx/bx/internal/version.Commit=$commit -X github.com/getbx/bx/internal/version.Date=$date"
          for os in linux darwin; do
            for arch in amd64 arm64; do
              name="bx_${os}_${arch}"
              mkdir -p "dist/$name"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="$ldflags" -o "dist/$name/bx" .
              tar -C "dist/$name" -czf "dist/$name.tar.gz" bx
              rm -rf "dist/$name"
            done
          done
          # Windows:PE VersionInfo 覆盖成 tag 版本(与 ldflags 一致),重生成 .syso 后再编;
          # 出 zip(内含 bx.exe,已全内嵌 wintun/sing-box/brook)。
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64,arm64 --out rsrc \
            --product-version "$version" --file-version "$version"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build -trimpath -ldflags="$ldflags" -o "dist/bx.exe" .
            (cd dist && zip -q "bx_windows_${arch}.zip" bx.exe && rm bx.exe)
          done
          # 给下游 installer job 留一份 amd64 exe(不进 release、不进 SHA256SUMS)
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$ldflags" -o "dist/bx-amd64.exe" .
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Upload windows exe for installer job
        uses: actions/upload-artifact@v4
        with:
          name: bx-windows-amd64-exe
          path: dist/bx-amd64.exe

      - name: Upload generic release files
        uses: actions/upload-artifact@v4
        with:
          name: bx-generic-release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  installer:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download windows exe
        uses: actions/download-artifact@v4
        with:
          name: bx-windows-amd64-exe
          path: dist

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $v = $version.TrimStart("v")
          $source = (Resolve-Path "dist\bx-amd64.exe").Path
          & iscc "/DMyAppVersion=$v" "/DSourceExe=$source" "packaging\windows\bx-setup.iss"
          Get-ChildItem packaging\windows\Output

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bx-windows-installer
          path: packaging/windows/Output/bx-setup.exe

  macos-package:
    needs: build
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: amd64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # v0.4.0 那次发布在这一步栽了:`hdiutil: create failed - No space left on device`。
      #
      # **不是产物变大了那么简单** —— 一次打包要同时容下:checkout(内嵌资产近 400MB)、
      # Go 的 build cache、swift build 的中间产物、release 目录(~96MB)、tar.gz(~39MB),
      # 而 .dmg 还要再要一份。macos-14 runner 的盘本来就紧,simulator runtimes 白占十几 GB
      # 而**这个 job 一个都用不到**(`swift build` 建的是原生 macOS 命令行产物,不碰模拟器)。
      #
      # `df -h` 留在前后两头:**这个 workflow 只在打 tag 时跑,平时的 CI 覆盖不到它**
      # (本文件开头那句注释),下一次它再满的时候,没有这两行就只能靠猜。
      - name: Free disk space for the .dmg
        run: |
          # **第一版这里只打 `df -h /`,而那是错的位置** —— 它显示 37Gi 可用,
          # 而 hdiutil 照样报 No space left on device。dmg 有两个落点:
          # `$DMG` 在工作目录,`STAGE`(package-macos-dmg.sh 里的 `mktemp -d`)
          # 在 $TMPDIR,两者未必与 `/` 同卷。**诊断要打在真正相关的位置上。**
          echo "--- all volumes (before) ---"; df -h
          echo "--- workdir ---"; df -h .
          echo "--- TMPDIR=${TMPDIR:-/tmp} ---"; df -h "${TMPDIR:-/tmp}"
          # **上一轮的诊断把「磁盘满」这个假设排除了**:workdir 与 TMPDIR 都在
          # /dev/disk3s5,**38Gi 可用**,而 dmg 只要 45MB —— hdiutil 那句
          # `No space left on device` 不是字面意思。APFS 上 `df` 的 Avail 含
          # purgeable,实际能分配的可能远低于它;所以这里仍然腾空间,但**先把
          # 占用明细打出来**,免得下一次又对着一个错的数字猜。
          echo "--- what is using the volume ---"
          sudo du -sh /Applications/* 2>/dev/null | sort -h | tail -8 || true
          sudo du -sh /Library/Developer/* 2>/dev/null | sort -h | tail -5 || true
          echo "--- selected Xcode ---"; xcode-select -p || true

          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Devices/* || true
          # 只删**没有被 xcode-select 选中**的那些 Xcode;swift build 要用选中的那个。
          keep="$(xcode-select -p 2>/dev/null | sed -E 's#(/Applications/[^/]+\.app).*#\1#')"
          for app in /Applications/Xcode*.app; do
            [ "$app" = "$keep" ] && continue
            echo "removing $app"; sudo rm -rf "$app" || true
          done
          echo "--- all volumes (after) ---"; df -h .

      - name: Package macOS release
        run: |
          set -euo pipefail
          version="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          BX_ARCH="${{ matrix.arch }}" BX_VERSION="$version" scripts/package-macos-release.sh
          BX_ARCH="${{ matrix.arch }}" BX_VERSION="$version" scripts/verify-macos-release.sh

      - name: Upload macOS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: bx-macos-${{ matrix.arch }}
          path: |
            dist.noindex/release/bx-macos-${{ matrix.arch }}.tar.gz
            dist.noindex/release/bx-macos-${{ matrix.arch }}.dmg

  publish:
    needs: [build, installer, macos-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - uses: actions/download-artifact@v4
        with:
          name: bx-generic-release
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: bx-windows-installer
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: bx-macos-*
          path: dist
          merge-multiple: true

      - name: Sign complete update manifest
        env:
          BX_UPDATE_PRIVATE_KEY: ${{ secrets.BX_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          go run ./scripts/sign-update-manifest.go --version "$version" --out dist/bx-update.json \
            --asset linux/amd64:dist/bx_linux_amd64.tar.gz \
            --asset linux/arm64:dist/bx_linux_arm64.tar.gz \
            --asset darwin/amd64:dist/bx_darwin_amd64.tar.gz \
            --asset darwin/arm64:dist/bx_darwin_arm64.tar.gz \
            --package darwin/amd64:dist/bx-macos-amd64.tar.gz \
            --package darwin/arm64:dist/bx-macos-arm64.tar.gz
          cd dist
          sha256sum *.tar.gz *.zip bx-update.json bx-update.json.sig > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/*
