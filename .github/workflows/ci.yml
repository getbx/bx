name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...

      - name: Format (gofumpt)
        run: |
          set -euo pipefail
          go install mvdan.cc/gofumpt@v0.10.0
          # 排除内嵌二进制资产,以及 internal/winfw —— 那是 WireGuard 的 vendored
          # 副本(SPDX MIT),CLAUDE.md 要求逐字保留以便与上游同步,按本项目格式
          # 规范重排会让下次同步产生大量假冲突。
          # 其余有漂移即失败(附文件名),防格式腐化。
          drift=$("$(go env GOPATH)/bin/gofumpt" -l $(git ls-files '*.go' | grep -v '^internal/embedded/assets/' | grep -v '^internal/winfw/'))
          if [ -n "$drift" ]; then
            echo "::error::以下文件未按 gofumpt 格式化,请跑 gofumpt -w:"; echo "$drift"; exit 1
          fi

      - name: Cross build (all targets)
        run: |
          set -euo pipefail
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o /dev/null .
            done
          done

      - name: Check workflow YAML
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |f| YAML.load_file(f); puts f }'

      - name: Check shell scripts
        run: for f in scripts/*.sh; do bash -n "$f"; done

  # ubuntu/macOS:真实 runner 上跑全量单测 + 原生构建。
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Test
        run: go test ./...

      - name: Build native binary
        run: go build -o /dev/null .

  # Windows 腿**只跑它证明得了的那部分**,而这是 2026-09-15 一次实测之后的决定,
  # 不是嫌麻烦:
  #
  #   - `go test ./...` 在 Windows 上红了**两个多月**(master 最后一次全绿是
  #     2026-07-08),168 条失败散在 15 个包里 —— 逐条看下来绝大多数是
  #     **darwin/linux 子系统的测试跑在一台 Windows 主机上**:`/tmp` 硬编码、
  #     0600 权限断言、launchd plist 路径、以及拿宿主 `filepath` 语义去校验
  #     POSIX 路径串(`filepath.IsAbs("/Applications/Bx.app")` 在 Windows 是 false)。
  #     那些代码在 Windows 上**编得进但跑不到**(Guardian 只在 darwin/linux 起)。
  #   - 同一天在真机(030-SJWJ-GSR-B)上跑只读命令,一次扫描抓到五条真缺陷
  #     (到处让人敲 sudo、拿 NTFS 判 0600、印 systemd 的服务名、explain 认不出
  #     物理网卡、preset 打出字面星号)—— **没有一条会被那 168 个测试里的任何
  #     一个抓到**。红着的腿不是严格,是等于不存在。
  #
  # 判据与 verify.sh 第 14 步同源:**清单从 git ls-files 现取,不手抄**,
  # 一个都找不到时响亮失败(那说明判据认不出它们了,而不是「没有要跑的」)。
  # 两组:带 `*_windows_test.go` 的包(那是 Windows **独家**能证明的行为),
  # 以及带 `purity_test.go` 的纯判据包(按构造与平台无关,在哪儿都该一样)。
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Test what this platform can actually prove
        shell: bash
        run: |
          set -euo pipefail
          pkgs="$(git ls-files '*_windows_test.go' '*purity_test.go' \
            | xargs -n1 dirname | sort -u | sed 's|^|./|')"
          if [ -z "$pkgs" ]; then
            echo "::error::一个 *_windows_test.go / *purity_test.go 都没找到 —— 这一步此刻什么都不跑"
            exit 1
          fi
          echo "$pkgs"
          # shellcheck disable=SC2086
          go test $pkgs

      - name: Build native binary
        run: go build -o bx-ci.exe .

  # macOS 菜单栏 App。在此之前 CI 从不编译任何 Swift 代码,也从不跑 Swift 测试:
  # 整个 apps/macos/BxMenu 与全部 Swift 套件只在有人本地手动跑时才被验证,
  # Swift 侧写个编译错误 CI 照样绿。这个 job 补上那个缺口。
  #
  # 两步不可互相替代:`swift build` 只编 SwiftPM target(Sources/BxMenu),
  # 而 Tests/ 下的文件不属于任何 target、只由 scripts/test-macos-menu.sh 用
  # swiftc 直编直跑。少任何一步都会漏掉一半代码。
  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build menu app
        run: swift build --package-path apps/macos/BxMenu

      # 脚本用 set -euo pipefail,任一套件失败即非零退出。但「一个套件都没跑」
      # 同样会安静地退 0(例如 run_test 块被误删),故断言收尾横幅确实打印过
      # ——与 integration job 断言 netns PoC 真跑过是同一条理由。
      - name: Run menu test suites
        run: |
          set -o pipefail
          bash scripts/test-macos-menu.sh | tee /tmp/menu-tests.log
          grep -q '^macOS menu tests passed$' /tmp/menu-tests.log \
            || { echo "::error::菜单测试脚本未跑到收尾横幅 —— 可能中途 return 或套件被清空"; exit 1; }

      # 菜单窗口的离屏快照。**这是 CI 第一次对 AppKit 那半边有任何断言** ——
      # 此前 swift build 只证明它编得过,窗口长什么样从来没有闸门。
      # 判据钉视图树(控件不许越过内容宽度),PNG 作为构件传上去给人看。
      # runner 没有可用 WindowServer 时脚本明说 SKIPPED 并退 0 —— 那是「跑不了」,
      # 与「跑了没过」必须分开;而它到底能不能跑,这一步的输出就是答案。
      - name: Snapshot menu windows
        run: bash scripts/snapshot-macos-menu.sh

      - name: Guard menu window layout
        run: go test ./internal/cli/ -run TestMacMenuWindowsKeepEveryControlInsideTheContentWidth -count=1

      - name: Upload menu snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-snapshots
          path: dist.noindex/menu-snapshots
          if-no-files-found: ignore

      # leakcheck 页面里那段纯解析 JS。与上面 Swift 那两步同一条理由:Go 测试
      # 进不去那半边,而它包含整页最承重的两个解析(WebRTC 那条结论看不看得见
      # 你的公网出口、出口 IP 与国家)。node 在 runner 上预装,不需要 setup-node。
      #
      # **放在 macos-app 这个 job 里跑一次就够** —— 那段 JS 与平台无关,三个
      # runner 各跑一遍只是重复;而放在这里能与 page.html 的其它守卫同时红。
      - name: Run leakcheck page js tests
        run: |
          set -o pipefail
          bash scripts/test-page-js.sh | tee /tmp/page-js.log
          grep -q '^page js tests passed$' /tmp/page-js.log \
            || { echo "::error::页面 JS 测试脚本未跑到收尾横幅 —— 可能中途 exit 或断言块被清空"; exit 1; }

  # 真的装一次,然后问系统「装完之后该是什么样」。
  #
  # **这个 job 是为一整类 bug 加的,而那类 bug 单测和复审都抓不到。** 2026-08-10
  # 真机首装抓到:全新安装写了 launchd plist 却从不 bootstrap 它,于是 guardian.sock
  # 要等第一次 `sudo bx up` 才存在 —— 而菜单栏那个**免密开关**连的就是那个 socket。
  # 后果是菜单栏第①期的免密开关**在全新安装这条路上从没能工作过**,而那一期的
  # 全部目的就是它。三期开发、六轮独立复审、几十次变异验证,全都没碰到它:
  # **所有测试和所有复审走的都是升级路径**(它会 bootout 再 bootstrap),
  # 而全新安装那条路在真机之前从没有人完整走过一遍。
  #
  # 它不是「写错了一行」,是**一整类场景从没被执行过** —— 那种东西只有真的装一次
  # 才会现形。同一晚还撞出第二个同族的:verify-macos-release.sh 里一条 grep 的模式
  # 以 `--` 开头被当成选项,那条守卫**一次都没有真正比对过内容**,而 verify 也因此
  # 从来跑不完。
  #
  # runner 是一次性 VM,装脏了无所谓。这里**不开保护**、不需要 VPS、不需要网络 ——
  # 只验「全新安装之后系统应该长什么样」,而那恰好就是上面那个 bug 违反的契约。
  macos-fresh-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # **这个 job 也打 .dmg,所以它也会栽在 hdiutil 上** —— 2026-09-15 实测,
      # 与 v0.4.0 那次发布同一句 `No space left on device`。当时的修法只加进了
      # release.yml,这一份从来没跟上;现在两边共用同一个动作。
      - uses: ./.github/actions/free-macos-disk

      - name: Package the release
        run: BX_VERSION=ci-fresh bash scripts/package-macos-release.sh

      # verify 自己也要跑:那条 --yes 守卫此前从来跑不完,而「跑不完」被当成
      # 别的问题绕过去了很久。
      - name: Verify the release layout
        run: BX_VERSION=ci-fresh bash scripts/verify-macos-release.sh

      - name: Install onto a machine that has never had bx
        run: |
          set -euo pipefail
          test ! -e /Applications/Bx.app || { echo "::error::runner 上已经有 Bx.app,这个 job 的前提是全新安装"; exit 1; }
          cd dist.noindex/release/bx-macos-arm64 2>/dev/null || cd dist.noindex/release/bx-macos-amd64
          ./install.sh --yes

      # **这里此前断言的是产品刻意不满足的契约,于是它从 2026-07 起一直红着。**
      # 全新安装 = **还没跑过 bx setup** 的机器,那台机器上没有 /etc/bx/config.yaml;
      # 而 daemon 启动要读 owner_uid、读不出就退出,plist 又带 KeepAlive=true ——
      # 硬 bootstrap 一个读不到配置的 Guardian 等于造一个每秒重启的崩溃循环。
      # `internal/cli/upgradeplan.go` 的 configUsable 那道门就是为这件事加的
      # (2026-08-10 真机换来的),所以「没有配置 ⇒ 不拉 Guardian」是**对的**。
      #
      # 契约因此是**一道门的两半**,两半都要钉:没配置时不许拉起来(否则是崩溃
      # 循环),配置一可用就必须拉起来(否则正是 2026-08-10 那个 bug —— 菜单栏的
      # 免密开关在全新安装这条路上从没能工作过)。只钉其中一半,另一半就是盲区。
      - name: Assert the contract while there is still no config
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          test -x /usr/local/bin/bx || fail "命令行入口没装上"

          if sudo launchctl print system/com.getbx.bx.guard >/dev/null 2>&1; then
            fail "还没有配置就把 Guardian bootstrap 了 —— KeepAlive=true 下那是一个每秒重启的崩溃循环,而安装会报成功"
          fi
          test ! -S /var/run/bx/guardian.sock \
            || fail "还没有配置就出现了 guardian.sock"

      # 第二半:配置一可用,Guardian 就必须被拉起来。
      # 这里刻意**不跑 bx setup** —— 它要做连通检测,而这个 job 没有 VPS 也不需要;
      # 判据(guardianConfigUsable)只要求 config.Parse 过得去,所以直接写一份最小配置,
      # 用的正是生产那道门看的那两样东西。
      - name: Assert Guardian comes up once the config is usable
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          sudo mkdir -p /etc/bx
          printf 'owner_uid: %s\nserver: brook://ci.invalid:9999?password=ci\n' "$(id -u)" \
            | sudo tee /etc/bx/config.yaml >/dev/null
          sudo chmod 600 /etc/bx/config.yaml

          cd dist.noindex/release/bx-macos-arm64 2>/dev/null || cd dist.noindex/release/bx-macos-amd64
          ./install.sh --yes

          sudo launchctl print system/com.getbx.bx.guard >/dev/null 2>&1 \
            || fail "配置已经可用,Guardian 仍然没被 bootstrap —— 菜单栏的免密开关连的就是它的 socket,这正是 2026-08-10 真机抓到的那个 bug"

          for _ in $(seq 1 20); do
            [ -S /var/run/bx/guardian.sock ] && break
            sleep 1
          done
          test -S /var/run/bx/guardian.sock \
            || fail "guardian.sock 不存在 —— 菜单栏连不上,免密开关点不动"

          # **装完绝不开启保护**,README 是这么向用户承诺的。
          state=$(sudo cat /var/lib/bx/guardian-state.json 2>/dev/null || echo '"off"')
          [ "$state" = '"off"' ] \
            || fail "安装把保护打开了(desired=$state)—— README 承诺的是不启动保护"

      - name: Uninstall leaves no launchd job behind
        run: |
          set -euo pipefail
          sudo /usr/local/bin/bx uninstall --yes || sudo /usr/local/bin/bx uninstall
          sudo launchctl print system/com.getbx.bx.guard >/dev/null 2>&1 \
            && { echo "::error::卸载之后 launchd job 还在"; exit 1; } || true

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # 门控的 netns 集成测试需 root(unshare CLONE_NEWNET + ip rule/route)。
      # 以 sudo 跑 go 的完整路径;普通 test job 仍跑无 root 单测,互不影响。
      # go test 对 SKIP 也报成功;用 grep 断言 PoC 测试真正跑通(PASS),防止静默 SKIP 蒙混过关。
      - name: Integration tests (netns, root)
        run: |
          set -o pipefail
          sudo "$(which go)" test -tags integration -v ./... | tee /tmp/itest.log
          grep -q -- '--- PASS: TestNetConfRoundTripInNetns' /tmp/itest.log \
            || { echo "::error::netns PoC 未真正运行(被 SKIP?)—— 集成环境可能缺 netns 能力"; exit 1; }

      # 集成台(真 supervisor.Run + 真 TUN + 真策略路由)同理,但**多一个坑**:
      # 台子会 re-exec 进子 net+mount namespace 跑断言,所以顶层打印的是 `--- SKIP`,
      # `--- PASS` 只出现在被 indentLines 缩进并加了 `  | ` 前缀的子进程输出里。
      # 写成 `grep '^--- PASS: TestHarness…'` 是**保证的假红** —— 故认那条带 `| ` 的行
      # (不锚首,缩进空格数由 go test 的嵌套深度决定,不该被写死)。
      #
      # 逐个名字分别断言,不合成一次 grep:某条被改名或删掉时必须当场红,
      # 而不是安静地少跑一条。退出码单独证明不了什么(SKIP、-test.run 打错、
      # 漏 -tags integration 全都退 0);上一步的 pipefail + 默认 `bash -e`
      # 保证非零必挂,两者合起来才等于「真跑过 **且** 全绿」。
      - name: Assert integration harness really ran
        run: |
          for name in \
            TestHarnessStartsAndRestoresCleanly \
            TestHarnessBypassCoversEveryConfiguredServerElseSilentLoop \
            TestHarnessAlsoStartsTheFailoverTransportsBranch \
            TestHarnessSwitchBetweenKnownServersDoesNotTouchRoutes \
            TestHarnessSwitchToNewServerInstallsBypassBeforeSwappingTransport \
            TestHarnessRefusesSwitchWhenTargetUnresolvable \
            TestHarnessBarrierCarveOutFollowsCurrentServerOnly \
            TestHarnessLinuxBarrierBlocksPublicButKeepsPrivateAndBypass \
            TestHarnessLinuxBarrierCarvesEveryDeclaredPrivateBlock \
            TestHarnessLinuxBarrierRemoveLeavesNothingBehind \
            TestHarnessLinuxEscapeHatchClearsOrphanBarrier \
            TestHarnessManagerUpStartsCoreAndLeavesNoBarrier \
            TestHarnessManagerDownStopsCoreForReal \
            TestHarnessManagerRefusesSecondCore \
            TestHarnessManagerCoreRuntimeIsObservable \
            TestHarnessRunDaemonServesStatusOnLinux \
            TestHarnessRunDaemonStartsWithoutADefaultRoute ; do
            grep -qF -- "| --- PASS: $name " /tmp/itest.log \
              || { echo "::error::集成台断言 $name 没有在子 namespace 里跑过(被 SKIP?改名?删了?)—— runner 可能缺 CAP_SYS_ADMIN 或 iproute2"; exit 1; }
          done
