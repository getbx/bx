name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...

      - name: Format (gofumpt)
        run: |
          set -euo pipefail
          go install mvdan.cc/gofumpt@v0.10.0
          # 排除内嵌二进制资产,以及 internal/winfw —— 那是 WireGuard 的 vendored
          # 副本(SPDX MIT),CLAUDE.md 要求逐字保留以便与上游同步,按本项目格式
          # 规范重排会让下次同步产生大量假冲突。
          # 其余有漂移即失败(附文件名),防格式腐化。
          drift=$("$(go env GOPATH)/bin/gofumpt" -l $(git ls-files '*.go' | grep -v '^internal/embedded/assets/' | grep -v '^internal/winfw/'))
          if [ -n "$drift" ]; then
            echo "::error::以下文件未按 gofumpt 格式化,请跑 gofumpt -w:"; echo "$drift"; exit 1
          fi

      - name: Cross build (all targets)
        run: |
          set -euo pipefail
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o /dev/null .
            done
          done

      - name: Check workflow YAML
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |f| YAML.load_file(f); puts f }'

      - name: Check shell scripts
        run: for f in scripts/*.sh; do bash -n "$f"; done

  # 三平台矩阵:在真实 ubuntu/macOS/windows runner 上跑平台无关单测 + 原生构建。
  # 抓可移植性回归(路径假设、平台专属编译);网络层集成(TUN/路由)仍靠真机 e2e,CI 跑不了。
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Test
        run: go test ./...

      - name: Build native binary
        run: go build -o /dev/null .

  # macOS 菜单栏 App。在此之前 CI 从不编译任何 Swift 代码,也从不跑 Swift 测试:
  # 整个 apps/macos/BxMenu 与全部 Swift 套件只在有人本地手动跑时才被验证,
  # Swift 侧写个编译错误 CI 照样绿。这个 job 补上那个缺口。
  #
  # 两步不可互相替代:`swift build` 只编 SwiftPM target(Sources/BxMenu),
  # 而 Tests/ 下的文件不属于任何 target、只由 scripts/test-macos-menu.sh 用
  # swiftc 直编直跑。少任何一步都会漏掉一半代码。
  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build menu app
        run: swift build --package-path apps/macos/BxMenu

      # 脚本用 set -euo pipefail,任一套件失败即非零退出。但「一个套件都没跑」
      # 同样会安静地退 0(例如 run_test 块被误删),故断言收尾横幅确实打印过
      # ——与 integration job 断言 netns PoC 真跑过是同一条理由。
      - name: Run menu test suites
        run: |
          set -o pipefail
          bash scripts/test-macos-menu.sh | tee /tmp/menu-tests.log
          grep -q '^macOS menu tests passed$' /tmp/menu-tests.log \
            || { echo "::error::菜单测试脚本未跑到收尾横幅 —— 可能中途 return 或套件被清空"; exit 1; }

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # 门控的 netns 集成测试需 root(unshare CLONE_NEWNET + ip rule/route)。
      # 以 sudo 跑 go 的完整路径;普通 test job 仍跑无 root 单测,互不影响。
      # go test 对 SKIP 也报成功;用 grep 断言 PoC 测试真正跑通(PASS),防止静默 SKIP 蒙混过关。
      - name: Integration tests (netns, root)
        run: |
          set -o pipefail
          sudo "$(which go)" test -tags integration -v ./... | tee /tmp/itest.log
          grep -q -- '--- PASS: TestNetConfRoundTripInNetns' /tmp/itest.log \
            || { echo "::error::netns PoC 未真正运行(被 SKIP?)—— 集成环境可能缺 netns 能力"; exit 1; }

      # 集成台(真 supervisor.Run + 真 TUN + 真策略路由)同理,但**多一个坑**:
      # 台子会 re-exec 进子 net+mount namespace 跑断言,所以顶层打印的是 `--- SKIP`,
      # `--- PASS` 只出现在被 indentLines 缩进并加了 `  | ` 前缀的子进程输出里。
      # 写成 `grep '^--- PASS: TestHarness…'` 是**保证的假红** —— 故认那条带 `| ` 的行
      # (不锚首,缩进空格数由 go test 的嵌套深度决定,不该被写死)。
      #
      # 逐个名字分别断言,不合成一次 grep:某条被改名或删掉时必须当场红,
      # 而不是安静地少跑一条。退出码单独证明不了什么(SKIP、-test.run 打错、
      # 漏 -tags integration 全都退 0);上一步的 pipefail + 默认 `bash -e`
      # 保证非零必挂,两者合起来才等于「真跑过 **且** 全绿」。
      - name: Assert integration harness really ran
        run: |
          for name in \
            TestHarnessStartsAndRestoresCleanly \
            TestHarnessBypassCoversEveryConfiguredServerElseSilentLoop \
            TestHarnessAlsoStartsTheFailoverTransportsBranch \
            TestHarnessSwitchBetweenKnownServersDoesNotTouchRoutes \
            TestHarnessSwitchToNewServerInstallsBypassBeforeSwappingTransport \
            TestHarnessRefusesSwitchWhenTargetUnresolvable \
            TestHarnessBarrierCarveOutFollowsCurrentServerOnly ; do
            grep -qF -- "| --- PASS: $name " /tmp/itest.log \
              || { echo "::error::集成台断言 $name 没有在子 namespace 里跑过(被 SKIP?改名?删了?)—— runner 可能缺 CAP_SYS_ADMIN 或 iproute2"; exit 1; }
          done
